name: Basketball Goal Manager Public Data AutoFetch
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "47 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: gmb-law-public-data-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate updater source and current catalogs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/autofetch/autofetch.py tools/autofetch/scholarship_autofetch.py tools/autofetch/lifecycle_archive.py
          python -m json.tool tools/autofetch/sources.json >/dev/null
          python -m json.tool tools/autofetch/scholarship-sources.json >/dev/null
          python -m json.tool data/activities.json >/dev/null
          python -m json.tool data/scholarships.json >/dev/null
          python -m json.tool data/activity-archive.json >/dev/null
          python -m json.tool data/scholarship-archive.json >/dev/null
      - name: Snapshot current catalogs
        shell: bash
        run: |
          cp data/activities.json "$RUNNER_TEMP/activities-before.json"
          cp data/scholarships.json "$RUNNER_TEMP/scholarships-before.json"
      - name: Refresh scholarships
        shell: bash
        run: |
          set -euo pipefail
          python tools/autofetch/scholarship_autofetch.py --repo .
      - name: Refresh activities
        shell: bash
        run: |
          set -euo pipefail
          python tools/autofetch/autofetch.py --repo . --apply --limit 30
      - name: Catalog integrity guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          old_a=json.loads((tmp/'activities-before.json').read_text(encoding='utf-8'))
          new_a=json.loads(Path('data/activities.json').read_text(encoding='utf-8'))
          old_s=json.loads((tmp/'scholarships-before.json').read_text(encoding='utf-8'))
          new_s=json.loads(Path('data/scholarships.json').read_text(encoding='utf-8'))
          a=new_a.get('events',[]); s=new_s.get('scholarships',[])
          if not isinstance(a,list) or not a: raise SystemExit('INTEGRITY_FAIL activity catalog empty')
          if not isinstance(s,list) or not s: raise SystemExit('INTEGRITY_FAIL scholarship catalog empty')
          for name,rows in [('activity',a),('scholarship',s)]:
              ids=[str(x.get('id') or '') for x in rows]
              if any(not x for x in ids) or len(ids)!=len(set(ids)):
                  raise SystemExit(f'INTEGRITY_FAIL {name} ids')
          old_ac=len(old_a.get('events',[])); old_sc=len(old_s.get('scholarships',[]))
          if old_ac>=20 and len(a)<old_ac*0.40: raise SystemExit('INTEGRITY_FAIL destructive activity shrink')
          if old_sc>=50 and len(s)<old_sc*0.40: raise SystemExit('INTEGRITY_FAIL destructive scholarship shrink')
          print(f'INTEGRITY_OK activities={len(a)} scholarships={len(s)}')
          PY
      - name: New-site behavior and freshness checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify.sh
          node scripts/check-public-data.js --strict-freshness
          git diff --check
      - name: Detect catalog changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- data/activities.json data/scholarships.json data/activity-archive.json data/scholarship-archive.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist refreshed public data
        if: steps.changed.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gmb-law-autofetch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json data/scholarships.json data/activity-archive.json data/scholarship-archive.json
          git commit -m "chore(data): refresh public catalogs ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Open or update public-data failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='🚨 Basketball Goal Manager: Public Data AutoFetch failed';
            const body=`Activity/Scholarship AutoFetch failed.\n\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- Time: ${new Date().toISOString()}\n\nIntegrity guards prevent destructive catalog writes.`;
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const found=issues.find(x=>x.title===title);
            if(found) await github.rest.issues.createComment({...context.repo,issue_number:found.number,body});
            else await github.rest.issues.create({...context.repo,title,body});
      - name: Close recovered public-data alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title='🚨 Basketball Goal Manager: Public Data AutoFetch failed';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const found=issues.find(x=>x.title===title);
            if(found){
              await github.rest.issues.createComment({...context.repo,issue_number:found.number,body:`✅ Public Data AutoFetch recovered on run ${context.runId}.`});
              await github.rest.issues.update({...context.repo,issue_number:found.number,state:'closed'});
            }

