name: Basketball Goal Manager AutoFetch Safe Check
on:
  push:
    branches: [ main ]
    paths:
      - "tools/autofetch/**"
      - "data/activities.json"
      - "data/scholarships.json"
      - "data/activity-archive.json"
      - "data/scholarship-archive.json"
      - "data/school-calendar.json"
      - "data/school-calendar-meta.json"
      - "js/domain/opportunities.js"
      - "js/domain/scholarships.js"
      - "js/system-health.js"
      - "scripts/check-public-data.js"
      - ".github/workflows/autofetch*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate updater and policy boundary
        run: |
          set -euo pipefail
          python -m py_compile tools/autofetch/autofetch.py tools/autofetch/scholarship_autofetch.py tools/autofetch/lifecycle_archive.py tools/autofetch/calendar_autofetch.py
          python tools/autofetch/calendar_autofetch.py --self-test
          python tools/autofetch/autofetch.py --self-test
          bash scripts/verify.sh
          node scripts/check-public-data.js
